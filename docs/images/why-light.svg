<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="What candor scores is the file you run">
<title>What candor scores is the file you run</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .text { fill: #1f2328; }
  .muted { fill: #59636e; }
  .card { fill: #f6f8fa; }
  .line { fill: #d1d9e0; }
  .chip { fill: #eaeef2; }
  .accent { fill: #0a7d5f; }
  .accent-soft { fill: #d7f4e9; }
  .warn { fill: #bc4c00; }
  .warn-soft { fill: #fff1e5; }
  .s-text { stroke: #1f2328; }
  .s-muted { stroke: #59636e; }
  .s-card { stroke: #f6f8fa; }
  .s-line { stroke: #d1d9e0; }
  .s-chip { stroke: #eaeef2; }
  .s-accent { stroke: #0a7d5f; }
  .s-accent-soft { stroke: #d7f4e9; }
  .s-warn { stroke: #bc4c00; }
  .s-warn-soft { stroke: #fff1e5; }
</style>
<rect x="0.75" y="0.75" width="486.5" height="258.5" rx="14" class="card s-line" stroke-width="1.5"/>
<text x="28" y="50" class="text" font-size="19" font-weight="700" text-anchor="start">Scored in PyTorch</text>
<line x1="42" y1="98" x2="42" y2="202" class="s-line" stroke-width="2"/>
<circle cx="42" cy="98" r="13" class="chip"/>
<text x="42" y="102.5" class="muted" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="103.5" class="text" font-size="15.5" font-weight="400" text-anchor="start">Edits scored on the 16-bit model</text>
<circle cx="42" cy="150" r="13" class="chip"/>
<text x="42" y="154.5" class="muted" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="155.5" class="text" font-size="15.5" font-weight="400" text-anchor="start">The best quantised to GGUF</text>
<circle cx="42" cy="202" r="13" class="warn"/>
<path d="M37.5,197.5 l9,9 M46.5,197.5 l-9,9" fill="none" class="s-card" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="207.5" class="warn" font-size="15.5" font-weight="700" text-anchor="start">The file you run: not the one scored</text>
<text x="28" y="240" class="muted" font-size="13.5" font-weight="400" text-anchor="start">Quantising can round a small edit away.</text>
<rect x="512.75" y="0.75" width="486.5" height="258.5" rx="14" class="card s-accent" stroke-width="1.5"/>
<text x="540" y="50" class="text" font-size="19" font-weight="700" text-anchor="start">Scored by candor</text>
<line x1="554" y1="98" x2="554" y2="202" class="s-line" stroke-width="2"/>
<circle cx="554" cy="98" r="13" class="accent-soft"/>
<text x="554" y="102.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="582" y="103.5" class="text" font-size="15.5" font-weight="400" text-anchor="start">Edits scored in llama-server, on your GGUF</text>
<circle cx="554" cy="150" r="13" class="accent-soft"/>
<text x="554" y="154.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="582" y="155.5" class="text" font-size="15.5" font-weight="400" text-anchor="start">The best written in, checked weight by weight</text>
<circle cx="554" cy="202" r="13" class="accent"/>
<path d="M548,202 l4.5,4.5 l8,-9" fill="none" class="s-card" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="582" y="207.5" class="accent" font-size="15.5" font-weight="700" text-anchor="start">The file you run: the one measured</text>
<text x="540" y="240" class="muted" font-size="13.5" font-weight="400" text-anchor="start">At your settings: sampling, thinking budget, KV cache.</text>
</svg>
