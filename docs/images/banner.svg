<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="candor: remove a model's refusal direction, scored the way you actually run it">
<title>candor: remove a model's refusal direction, scored the way you actually run it</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#0f1c22"/>
    <stop offset="1" stop-color="#0c3128"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#5fd7af" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#5fd7af" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
  </pattern>
  <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#5fd7af"/>
  </marker>
  <marker id="tip-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
  </marker>
  <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1000" height="260" fill="url(#sky)"/>
  <rect width="1000" height="260" fill="url(#dots)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>
</g>
<text x="56" y="108" fill="#f0f6fc" font-size="76" font-weight="800" letter-spacing="-2">candor</text>
<text x="60" y="148" fill="#c9d1d9" font-size="22">Remove a model's refusal direction,</text>
<text x="60" y="178" fill="#5fd7af" font-size="22" font-weight="600">scored the way you actually run it.</text>
<rect x="60" y="204" width="95.5" height="30" rx="15" fill="#5fd7af" fill-opacity="0.08" stroke="#5fd7af" stroke-opacity="0.45"/>
<text x="107.75" y="224" fill="#a7ecd5" font-size="13.5" text-anchor="middle">llama.cpp</text>
<rect x="165.5" y="204" width="133.0" height="30" rx="15" fill="#5fd7af" fill-opacity="0.08" stroke="#5fd7af" stroke-opacity="0.45"/>
<text x="232.0" y="224" fill="#a7ecd5" font-size="13.5" text-anchor="middle">quantised GGUF</text>
<rect x="308.5" y="204" width="140.5" height="30" rx="15" fill="#5fd7af" fill-opacity="0.08" stroke="#5fd7af" stroke-opacity="0.45"/>
<text x="378.75" y="224" fill="#a7ecd5" font-size="13.5" text-anchor="middle">thinking models</text>
<rect x="459.0" y="204" width="185.5" height="30" rx="15" fill="#5fd7af" fill-opacity="0.08" stroke="#5fd7af" stroke-opacity="0.45"/>
<text x="551.75" y="224" fill="#a7ecd5" font-size="13.5" text-anchor="middle">answers never printed</text>
<line x1="742" y1="214" x2="742" y2="38" stroke="#f0883e" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="732" y="34" fill="#f0883e" font-size="13" text-anchor="end">refusal direction</text>
<line x1="900" y1="70" x2="900" y2="200" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 4"/>
<text x="912" y="139.0" fill="#f0883e" font-size="13">removed</text>
<path d="M889,200 V189 H900" fill="none" stroke="#8b949e" stroke-width="1.2"/>
<line x1="742" y1="200" x2="897" y2="73" stroke="#8b949e" stroke-width="2.5" marker-end="url(#tip-grey)"/>
<text transform="translate(814.0 126.0) rotate(-39.4)" fill="#8b949e" font-size="13" text-anchor="middle">activation</text>
<line x1="742" y1="200" x2="896" y2="200" stroke="#5fd7af" stroke-width="3.5" marker-end="url(#tip)"/>
<text x="821.0" y="226" fill="#5fd7af" font-size="13" text-anchor="middle">edited</text>
<circle cx="742" cy="200" r="4" fill="#f0f6fc"/>
</svg>
