<text x="114.5" y="124" class="text" font-size="16.5" font-weight="700" text-anchor="middle">Read directions</text>
<text x="114.5" y="148" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">harmful vs harmless prompts,</text>
<text x="114.5" y="167" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">mean difference per layer</text>
<rect x="64.5" y="184" width="100.0" height="26" rx="6" class="chip"/>
<text x="114.5" y="201.5" class="mono text" font-size="12.5" text-anchor="middle">candor run</text>
<line x1="234" y1="113" x2="251" y2="113" class="s-muted" stroke-width="2" marker-end="url(#head-muted)"/>
<rect x="257.75" y="0.75" width="227.5" height="224.5" rx="12" class="card s-line" stroke-width="1.5"/>
<circle cx="283" cy="26" r="13" class="accent-soft"/>
<text x="283" y="30.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">2</text>
<rect x="335.5" y="47" width="54" height="11" rx="3" class="chip s-line"/>
<line x1="389.5" y1="52.5" x2="396.5" y2="52.5" class="s-accent" stroke-width="2"/>
<rect x="396.5" y="47" width="11" height="11" rx="2.5" class="accent"/>
<rect x="335.5" y="62" width="54" height="11" rx="3" class="chip s-line"/>
<line x1="389.5" y1="67.5" x2="396.5" y2="67.5" class="s-accent" stroke-width="2"/>
<rect x="396.5" y="62" width="11" height="11" rx="2.5" class="accent"/>
<rect x="335.5" y="77" width="54" height="11" rx="3" class="chip s-line"/>
<line x1="389.5" y1="82.5" x2="396.5" y2="82.5" class="s-accent" stroke-width="2"/>
<rect x="396.5" y="77" width="11" height="11" rx="2.5" class="accent"/>
<text x="371.5" y="124" class="text" font-size="16.5" font-weight="700" text-anchor="middle">Build adapters</text>
<text x="371.5" y="148" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">rank-1 LoRA adapters,</text>
<text x="371.5" y="167" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">one per edited weight</text>
<rect x="321.5" y="184" width="100.0" height="26" rx="6" class="chip"/>
<text x="371.5" y="201.5" class="mono text" font-size="12.5" text-anchor="middle">candor run</text>
<line x1="491" y1="113" x2="508" y2="113" class="s-muted" stroke-width="2" marker-end="url(#head-muted)"/>
<rect x="514.75" y="0.75" width="227.5" height="224.5" rx="12" class="card s-line" stroke-width="1.5"/>
<circle cx="540" cy="26" r="13" class="accent-soft"/>
<text x="540" y="30.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">3</text>
<path d="M590.5,42 V90 H666.5" fill="none" class="s-muted" stroke-width="2" stroke-linecap="round"/>
<line x1="594.5" y1="70" x2="664.5" y2="70" class="s-warn" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="602.5" cy="54" r="3.5" class="muted"/>
<circle cx="616.5" cy="62" r="3.5" class="muted"/>
<circle cx="628.5" cy="50" r="3.5" class="muted"/>
<circle cx="640.5" cy="64" r="3.5" class="muted"/>
<circle cx="654.5" cy="56" r="3.5" class="muted"/>
<circle cx="632.5" cy="80" r="3.5" class="muted"/>
<circle cx="646.5" cy="82" r="3.5" class="muted"/>
<circle cx="656.5" cy="76" r="3.5" class="muted"/>
<circle cx="614.5" cy="79" r="7.5" fill="none" class="s-accent" stroke-width="2"/>
<circle cx="614.5" cy="79" r="3.5" class="accent"/>
<text x="628.5" y="124" class="text" font-size="16.5" font-weight="700" text-anchor="middle">Search</text>
<text x="628.5" y="148" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">every adapter in one server;</text>
<text x="628.5" y="167" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">a trial only sets strengths</text>
<rect x="567.1" y="184" width="122.8" height="26" rx="6" class="chip"/>
<text x="628.5" y="201.5" class="mono text" font-size="12.5" text-anchor="middle">candor search</text>
<line x1="748" y1="113" x2="765" y2="113" class="s-muted" stroke-width="2" marker-end="url(#head-muted)"/>
<rect x="771.75" y="0.75" width="227.5" height="224.5" rx="12" class="card s-line" stroke-width="1.5"/>
<circle cx="797" cy="26" r="13" class="accent-soft"/>
<text x="797" y="30.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">4</text>
<path d="M865.5,42 H893.5 L905.5,54 V94 H865.5 Z" class="card s-text" stroke-width="2" stroke-linejoin="round"/>
<path d="M893.5,42 V54 H905.5" fill="none" class="s-text" stroke-width="2" stroke-linejoin="round"/>
<path d="M875.5,71 l7,7 l13,-15" fill="none" class="s-accent" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="885.5" y="124" class="text" font-size="16.5" font-weight="700" text-anchor="middle">Export and measure</text>
<text x="885.5" y="148" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">written into your GGUF,</text>
<text x="885.5" y="167" class="muted" font-size="13.5" font-weight="400" text-anchor="middle">then that exact file measured</text>
<rect x="824.1" y="184" width="122.8" height="26" rx="6" class="chip"/>
<text x="885.5" y="201.5" class="mono text" font-size="12.5" text-anchor="middle">candor export</text>
</svg>
