<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 226" width="1000" height="226" role="img" aria-label="How candor works, in four stages">
<title>How candor works, in four stages</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .text { fill: #e6edf3; }
  .muted { fill: #9198a1; }
  .card { fill: #151b23; }
  .line { fill: #3d444d; }
  .chip { fill: #262c36; }
  .accent { fill: #5fd7af; }
  .accent-soft { fill: #12352b; }
  .warn { fill: #f0883e; }
  .warn-soft { fill: #3d2513; }
  .s-text { stroke: #e6edf3; }
  .s-muted { stroke: #9198a1; }
  .s-card { stroke: #151b23; }
  .s-line { stroke: #3d444d; }
  .s-chip { stroke: #262c36; }
  .s-accent { stroke: #5fd7af; }
  .s-accent-soft { stroke: #12352b; }
  .s-warn { stroke: #f0883e; }
  .s-warn-soft { stroke: #3d2513; }
</style>
<defs><marker id="head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker></defs>
<rect x="0.75" y="0.75" width="227.5" height="224.5" rx="12" class="card s-line" stroke-width="1.5"/>
<circle cx="26" cy="26" r="13" class="accent-soft"/>
<text x="26" y="30.5" class="accent" font-size="13" font-weight="700" text-anchor="middle">1</text>
<circle cx="76.5" cy="58" r="5" class="warn"/>
<circle cx="88.5" cy="70" r="5" class="warn"/>
<circle cx="75.5" cy="80" r="5" class="warn"/>
<circle cx="142.5" cy="57" r="5" class="muted"/>
<circle cx="154.5" cy="68" r="5" class="muted"/>
<circle cx="144.5" cy="79" r="5" class="muted"/>
