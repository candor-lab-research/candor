[project]
name = "candor"
version = "0.1.0"
description = "Remove a model's refusal direction, scored the way you actually run the model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "datasets>=4",
    # The same llama.cpp release as the engine, so tensor and architecture names always agree.
    "gguf @ git+https://github.com/ggml-org/llama.cpp@b11524#subdirectory=gguf-py",
    "httpx>=0.28",
    "huggingface-hub>=2.2",
    "numpy>=2",
    "pydantic>=2.10",
    "rich>=15",
    "safetensors>=0.6",
    "torch>=2.8",
    "transformers>=5",
    "typer>=0.27",
]

[project.scripts]
candor = "candor.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["src/candor/js/node_modules"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
