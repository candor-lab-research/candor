[project]
name = "candor"
version = "0.1.0"
description = "Remove a model's refusal direction, scored the way you actually run the model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "datasets>=4",
    # The same llama.cpp release as the engine, so tensor and architecture names always agree.
    "gguf @ git+https://github.com/ggml-org/llama.cpp@b11524#subdirectory=gguf-py",
    "httpx>=0.28",
    "huggingface-hub>=2.2",
    "jinja2>=3.1",
    "numpy>=2",
    "optuna>=4.7,<5",
    "pydantic>=2.10",
    "questionary>=2.1",
    "rich>=15",
    "safetensors>=0.6",
    "torch>=2.8",
    "transformers>=5",
    "typer>=0.27",
]

[project.scripts]
candor = "candor.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
]

[tool.uv.sources]
# On Linux pods torch uses CUDA 12.8, as llama.cpp's release does, so both run on any host that runs
# either. Its last CUDA 12.8 build is 2.11, so pods stay on 2.11 while the Mac moves on, and a torch
# floor above 2.11 breaks the lock.
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
# The miss-rate simulator is kept exactly as its results ran, so it isn't linted or reformatted.
extend-exclude = ["tools/misscheck"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Above the slowest test (an e2e one, about 220 s): a test that hangs shows every thread's stack.
faulthandler_timeout = 300
